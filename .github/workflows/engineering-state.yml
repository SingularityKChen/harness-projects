name: Engineering state

# 事件与 schedule 都只是唤醒 hint：这个特权 workflow 始终来自默认分支，checkout 也显式指向默认分支；
# 唯一 writer 每次读取目标 Project 的完整快照并重算全部本仓 Issue，不由 hint 限定范围。
# 最后一个 hint 被并发组取消时，独立 schedule 提供再次重算的机会（不保证 30 分钟 SLA）。
on:
  pull_request_target:
    types: [opened, edited, reopened, ready_for_review, converted_to_draft, synchronize, closed]
  workflow_run:
    workflows: [Engineering state signal]
    types: [completed]
  schedule:
    - cron: '17,47 * * * *'

permissions:
  contents: read
  actions: read

jobs:
  sync:
    name: Reconcile engineering state
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'pull_request_target' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'pull_request_review' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    # 全局串行避免不同来源的 hint 在 query/write 之间交错，从而让较早 snapshot 覆盖较新结果。
    # 放在 job 级而不是 workflow 级：workflow 级 group 在 job `if` 求值之前就排队，fork 事件等
    # 未准入的运行会先挤掉排队中的已准入运行或 schedule，自己再被 `if` 跳过。
    concurrency:
      group: engineering-state-reconcile
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc

      - name: Classify the triggering signal
        id: signal
        env:
          EVENT_NAME: ${{ github.event_name }}
          TARGET_PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          GITHUB_TOKEN: ${{ github.token }}
          PULL_REQUESTS_JSON: ${{ toJSON(github.event.workflow_run.pull_requests) }}
        run: |
          if [ "$EVENT_NAME" = "pull_request_target" ]; then
            case "$TARGET_PR_NUMBER" in
              ''|*[!0-9]*|0) echo "invalid pull request number" >&2; exit 1 ;;
            esac
            printf 'decision=reconcile\n' >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = "schedule" ]; then
            printf 'decision=reconcile\n' >> "$GITHUB_OUTPUT"
          else
            node scripts/engineering-state-signal.mjs
          fi

      - name: Reconcile Engineering across the whole Project
        if: steps.signal.outputs.decision == 'reconcile'
        env:
          PROJECTS_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
          ENGINEERING_FIELD_ID: ${{ vars.PROJECTS_ENGINEERING_FIELD_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RECONCILE_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: node scripts/reconcile-engineering-project.mjs
