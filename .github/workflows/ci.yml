name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # PR 上取消旧运行是对的，但合并到 main 的验证记录不可被后续合并取消。
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # 跑 PR 代码的 lane。新增 lane 时只加在这里，不必改分支保护。
  verify:
    name: Verify（typecheck + 契约测试）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # 版本来自 package.json 的 packageManager 字段，避免两处漂移。
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test

  browser:
    name: Browser（生产组合读取与恢复）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm test:browser

      - name: 保留浏览器失败截图与 trace
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: composed-browser-failure
          path: |
            test-results/composed-browser/**/*.png
            test-results/composed-browser/**/*.zip
          retention-days: 7
          include-hidden-files: false
          if-no-files-found: ignore

  # Windows 原生 lane（#646）：GitHub-hosted windows-2025 x64 上真实执行已交付的
  # 原生套件。文件集、每文件用例下界与 skip 预算只在
  # scripts/windows-native-checks.mjs 的 SETS 里，这里只按 set 名调用。
  # 两阶段身份：runner 管理员跑 Git 路径/身份/恢复类用例；临时标准本地用户跑
  # 安全、Host 生命周期与 packed plugin（测试用 ordinaryToken 自证非管理员）。
  windows-native:
    name: Windows Native（原生安全与平台契约）
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # packed plugin 原生用例直接 import dist/package，必须先构建。
      - run: pnpm --filter @harness-projects/app-harness-plugin build

      - name: 记录 runner、工具链与 runner 提权身份
        run: |
          $ErrorActionPreference = 'Stop'
          git rev-parse HEAD
          Write-Output "ImageOS=$env:ImageOS ImageVersion=$env:ImageVersion Architecture=$env:PROCESSOR_ARCHITECTURE"
          node --version
          git --version
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $admin = (New-Object Security.Principal.WindowsPrincipal($identity)).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          $adminMember = $identity.Groups.Value -contains 'S-1-5-32-544'
          Write-Output "runner-identity sid=$($identity.User.Value) admin=$admin adminMember=$adminMember"

      # 阶段 1：唯一历史原生证据（run 43853289308 / source 3091d4ab）就是管理员
      # 身份；这里承担 Git 路径/身份/恢复类行为，以及悬空 reparse/架构前提的创建拒绝，
      # 不作为普通用户隔离证据。入口必须证明 runner 真的打印了通过 marker：
      # 路径/argv 形态变化跳过 main() 时退出码仍是 0（#660）。
      - name: 阶段 1：runner 管理员执行 native-git 套件
        run: |
          $ErrorActionPreference = 'Stop'
          $output = (& node scripts/windows-native-checks.mjs --set native-git 2>&1 | Out-String)
          Write-Output $output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($output -notmatch 'windows-native-checks: set=native-git files=3 tests=\d+ skipped=0 todo=0') {
            Write-Output '::error::windows-native-checks: set=native-git 缺少或不符合通过标记，按 fail closed 处理'
            exit 1
          }

      # 阶段 2：账户、profile 与 foreign fixture 的生命周期只由这一处拥有；
      # 清理走 finally，不用 step 级 if。输出经 <fixture> 令牌化后回显。
      - name: 阶段 2：临时标准本地用户执行 private-data 套件
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = 'account'
          $profile = $null
          $sid = $null
          $fixtureVolumes = @()
          $shareDir = $null
          $shareCreated = $false
          $nativeExit = 1
          $name = 'hp' + [Guid]::NewGuid().ToString('N').Substring(0, 10)
          function Show-NativeOutput($file) {
            if (Test-Path -LiteralPath $file) {
              Get-Content -LiteralPath $file | ForEach-Object {
                $line = $_.ToString()
                foreach ($root in @($env:GITHUB_WORKSPACE, $env:RUNNER_TEMP, $env:USERPROFILE, $profile)) {
                  if ($root) { $line = $line.Replace($root, '<fixture>').Replace($root.Replace('\', '\\'), '<fixture>').Replace($root.Replace('\', '/'), '<fixture>') }
                }
                Write-Output $line
              }
            }
          }
          function New-FixtureVolume([int]$SizeMb, [string]$FileSystem, [string]$Label, [string]$ExpectedFileSystem) {
            $used = [IO.DriveInfo]::GetDrives() | ForEach-Object { $_.Name.Substring(0, 1).ToUpperInvariant() }
            $letter = $null
            foreach ($candidate in 'LMNOPQRSTUVWXY'.ToCharArray()) { if ($used -notcontains [string]$candidate) { $letter = [string]$candidate; break } }
            if (!$letter) { throw 'no free drive letter for the volume fixture' }
            $vhd = Join-Path $env:RUNNER_TEMP ("harness-vol-" + [Guid]::NewGuid().ToString('N') + '.vhd')
            $diskpart = Join-Path $env:RUNNER_TEMP ("diskpart-" + [Guid]::NewGuid().ToString('N') + '.txt')
            $volume = $null
            try {
              @("create vdisk file=`"$vhd`" maximum=$SizeMb type=expandable", "select vdisk file=`"$vhd`"", 'attach vdisk', 'create partition primary', "format fs=$FileSystem quick label=$Label", "assign letter=$letter") | Set-Content -LiteralPath $diskpart -Encoding ascii
              & diskpart.exe /s $diskpart | Out-Host
              if ($LASTEXITCODE -ne 0) { throw "volume fixture failed fs=$FileSystem exit=$LASTEXITCODE" }
              for ($attempt = 0; $attempt -lt 20 -and !$volume; $attempt++) {
                $volume = Get-CimInstance Win32_LogicalDisk -Filter "VolumeName='$Label'" -ErrorAction SilentlyContinue | Select-Object -First 1
                if (!$volume) { Start-Sleep -Seconds 1 }
              }
              if (!$volume -or $volume.DriveType -ne 3 -or $volume.FileSystem -ne $ExpectedFileSystem) { throw "volume fixture facts mismatch fs=$FileSystem label=$Label" }
              return [pscustomobject]@{ Vhd = $vhd; Diskpart = $diskpart; Label = $Label; Device = $volume.DeviceID }
            } catch {
              $detach = Join-Path $env:RUNNER_TEMP ("diskpart-detach-" + [Guid]::NewGuid().ToString('N') + '.txt')
              @("select vdisk file=`"$vhd`"", 'detach vdisk noerr') | Set-Content -LiteralPath $detach -Encoding ascii
              & diskpart.exe /s $detach 2>&1 | Out-Null
              Remove-Item -LiteralPath $detach, $diskpart, $vhd -Force -ErrorAction SilentlyContinue
              throw
            }
          }
          try {
            $password = [Convert]::ToBase64String([Security.Cryptography.RandomNumberGenerator]::GetBytes(30)) + 'aA1!'
            $secure = ConvertTo-SecureString $password -AsPlainText -Force
            New-LocalUser -Name $name -Password $secure -AccountNeverExpires -UserMayNotChangePassword | Out-Null
            $sid = (Get-LocalUser -Name $name).SID.Value
            Add-LocalGroupMember -SID 'S-1-5-32-545' -Member $name
            $credential = [Management.Automation.PSCredential]::new("$env:COMPUTERNAME\$name", $secure)
            $node = (Get-Command node.exe).Source
            $stage = 'profile'
            $init = Start-Process -FilePath $node -ArgumentList @('-e', 'process.exit(0)') -Credential $credential -LoadUserProfile -WorkingDirectory $env:GITHUB_WORKSPACE -Wait -PassThru
            if ($init.ExitCode -ne 0) { throw 'profile initialization failed' }
            $profile = (Get-CimInstance Win32_UserProfile -Filter "SID='$sid'").LocalPath
            if (!$profile) { throw 'profile missing' }
            $stage = 'foreign-fixture'
            $foreign = Join-Path $profile 'harness-foreign-profile'
            $env:HARNESS_NATIVE_FIXTURE_PROFILE = $foreign
            $env:HARNESS_NATIVE_FIXTURE_SID = $sid
            $bootstrapLog = Join-Path $profile 'bootstrap.log'
            node --input-type=module -e "import {provisionForeignFixture} from './tests/integration/harness-plugin-windows-fixture.js'; await provisionForeignFixture(process.env.HARNESS_NATIVE_FIXTURE_PROFILE,process.env.HARNESS_NATIVE_FIXTURE_SID)" *> $bootstrapLog
            $bootstrapExit = $LASTEXITCODE
            Show-NativeOutput $bootstrapLog
            if ($bootstrapExit -ne 0) { throw 'foreign fixture failed' }
            # #679：管理员预置两类真实设备。exFAT（256MB VHD，现实外接介质场景；真实卷根
            # 由 identity gate 更早拒绝）与 ReFS（4GB sparse VHD；命中文件系统 gate）用于卷
            # 准入证据；回环 SMB 共享用于 DriveType gate。标准用户测试进程按固定卷标/共享名
            # 发现设备并自建映射盘，不经 argv/env 传递坐标。
            $stage = 'volume-fixture'
            $fixtureVolumes += New-FixtureVolume -SizeMb 256 -FileSystem 'exfat' -Label 'HARNESSFAT' -ExpectedFileSystem 'exFAT'
            $fixtureVolumes += New-FixtureVolume -SizeMb 4096 -FileSystem 'refs' -Label 'HARNESSRFS' -ExpectedFileSystem 'ReFS'
            $stage = 'share-fixture'
            $shareDir = Join-Path $env:ProgramData ("harness-vol-share-" + [Guid]::NewGuid().ToString('N'))
            New-Item -ItemType Directory -Path $shareDir -Force | Out-Null
            & icacls.exe $shareDir /grant "${name}:(OI)(CI)M" | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'volume share ACL failed' }
            New-SmbShare -Name 'harness-vol-fixture' -Path $shareDir -FullAccess "$env:COMPUTERNAME\$name" | Out-Null
            $shareCreated = $true
            $broad = @(Get-SmbShareAccess -Name 'harness-vol-fixture' | Where-Object { $_.AccountName -match '^(Everyone|ANONYMOUS LOGON|BUILTIN\\Users)$' })
            if ($broad.Count -gt 0) { throw 'volume share grants a broad principal' }
            $stdout = Join-Path $profile 'native.stdout'
            $stderr = Join-Path $profile 'native.stderr'
            $arguments = @('scripts/windows-native-checks.mjs', '--set', 'private-data', '--profile', "`"$profile`"", '--foreign', "`"$foreign`"")
            $stage = 'standard-user-tests'
            # runner 在标准用户进程内把 --profile/--foreign 映射为 USERPROFILE、
            # TEMP/TMP 与 HARNESS_WINDOWS_FOREIGN_PROFILE，再执行 SETS 里的文件。
            $process = Start-Process -FilePath $node -ArgumentList $arguments -Credential $credential -LoadUserProfile -WorkingDirectory $env:GITHUB_WORKSPACE -RedirectStandardOutput $stdout -RedirectStandardError $stderr -Wait -PassThru
            $nativeExit = $process.ExitCode
            Show-NativeOutput $stdout
            Show-NativeOutput $stderr
            $nativeOut = if (Test-Path -LiteralPath $stdout) { Get-Content -LiteralPath $stdout -Raw } else { '' }
            if ($nativeExit -eq 0 -and $nativeOut -notmatch 'windows-native-checks: set=private-data files=4 tests=\d+ skipped=0 todo=0') {
              Write-Output '::error::windows-native-checks: set=private-data 缺少或不符合通过标记，按 fail closed 处理'
              $nativeExit = 1
            }
            Write-Output "standard-user exit=$nativeExit"
          } catch {
            Write-Output "windows-native-harness-failure stage=$stage type=$($_.Exception.GetType().Name) hresult=$($_.Exception.HResult)"
            $nativeExit = 1
          } finally {
            if ($shareCreated) { Remove-SmbShare -Name 'harness-vol-fixture' -Force -ErrorAction SilentlyContinue }
            foreach ($fixture in $fixtureVolumes) {
              $detach = Join-Path $env:RUNNER_TEMP ("diskpart-detach-" + [Guid]::NewGuid().ToString('N') + '.txt')
              @("select vdisk file=`"$($fixture.Vhd)`"", 'detach vdisk noerr') | Set-Content -LiteralPath $detach -Encoding ascii
              & diskpart.exe /s $detach | Out-Null
              Remove-Item -LiteralPath $detach, $fixture.Vhd, $fixture.Diskpart -Force -ErrorAction SilentlyContinue
            }
            if ($shareDir) { Remove-Item -LiteralPath $shareDir -Recurse -Force -ErrorAction SilentlyContinue }
            if ($sid) { Get-CimInstance Win32_UserProfile -Filter "SID='$sid'" -ErrorAction SilentlyContinue | Remove-CimInstance -ErrorAction SilentlyContinue }
            Remove-LocalUser -Name $name -ErrorAction SilentlyContinue
          }
          exit $nativeExit


  # 分支保护只 require 这一个名字（AGENTS.md §9.2）。
  # 它不 checkout PR 代码、不读 secrets，只汇总上面 lane 的结果：
  # 这样增删 lane 不会改变保护配置，也不会让"发布必需状态"的 job 执行不可信代码。
  fast-gate:
    name: PR Fast Gate
    needs: [verify, browser, windows-native]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 任一 lane 未成功则失败
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "::error::Needed job results: ${{ join(needs.*.result, ', ') }}"
          exit 1

      - name: 汇总
        run: |
          echo "All needed jobs succeeded: ${{ join(needs.*.result, ', ') }}"
