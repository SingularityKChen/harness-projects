name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fast-gate:
    # 名称即分支保护引用的检查名（AGENTS.md §9.2）：改名必须同步修改保护配置。
    name: PR Fast Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 版本来自 package.json 的 packageManager 字段，避免两处漂移。
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test
